<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Francis Obalim monogram">
  <!-- Simplified favicon variant. The full ring mark (see #i-logo in
       index.html) loses its centre at 16px, so the tab icon drops the O
       and carries the F alone, reversed out of gold for contrast against
       both light and dark tab bars. -->
  <rect width="100" height="100" rx="22" fill="#e6c07b" />
  <g fill="#090c0d">
    <rect x="32" y="24" width="13" height="52" />
    <rect x="32" y="24" width="36" height="13" />
    <rect x="32" y="43" width="28" height="13" />
  </g>
</svg>
