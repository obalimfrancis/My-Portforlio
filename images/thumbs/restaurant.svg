<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Abstract illustration of a restaurant menu card beside a plate with cutlery">
  <defs>
    <linearGradient id="rs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#182124"/>
      <stop offset="100%" stop-color="#101618"/>
    </linearGradient>
    <linearGradient id="rs-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6c07b" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#4fa39e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rs-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2b3639" stroke-width="1" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#rs-bg)"/>
  <rect width="800" height="500" fill="url(#rs-grid)"/>
  <rect width="800" height="500" fill="url(#rs-glow)"/>

  <!-- plate with cutlery -->
  <g transform="translate(212 250)">
    <circle r="132" fill="#0d1214" stroke="#2b3639" stroke-width="2"/>
    <circle r="102" fill="none" stroke="#243033" stroke-width="2"/>
    <circle r="72" fill="#151d1f"/>
    <circle r="72" fill="none" stroke="#e6c07b" stroke-width="2" opacity=".45"/>
    <!-- plated food -->
    <circle cx="-18" cy="-10" r="24" fill="#4fa39e" opacity=".45"/>
    <circle cx="22" cy="6" r="18" fill="#e6c07b" opacity=".55"/>
    <circle cx="-6" cy="30" r="13" fill="#2b3639"/>

    <!-- fork -->
    <g transform="translate(-176 -66)" stroke="#8b9b9c" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M8 0v38M20 0v38M32 0v38"/>
      <path d="M20 38v94"/>
    </g>
    <!-- knife -->
    <g transform="translate(150 -66)" fill="none" stroke="#8b9b9c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 0c14 16 14 38 0 54"/>
      <path d="M14 54v78"/>
    </g>
  </g>

  <!-- menu card -->
  <g transform="translate(436 92)">
    <rect width="292" height="316" rx="16" fill="#0d1214" stroke="#2b3639"/>
    <rect x="28" y="34" width="132" height="14" rx="7" fill="#e6c07b" opacity=".9"/>
    <rect x="28" y="60" width="72" height="8" rx="4" fill="#4fa39e" opacity=".6"/>
    <line x1="28" y1="88" x2="264" y2="88" stroke="#243033" stroke-width="2"/>

    <g>
      <rect x="28" y="110" width="114" height="10" rx="5" fill="#b3c0c0" opacity=".55"/>
      <rect x="28" y="128" width="164" height="7" rx="3.5" fill="#2b3639"/>
      <rect x="216" y="110" width="48" height="10" rx="5" fill="#e6c07b" opacity=".7"/>

      <rect x="28" y="166" width="132" height="10" rx="5" fill="#b3c0c0" opacity=".55"/>
      <rect x="28" y="184" width="144" height="7" rx="3.5" fill="#2b3639"/>
      <rect x="216" y="166" width="48" height="10" rx="5" fill="#e6c07b" opacity=".7"/>

      <rect x="28" y="222" width="98" height="10" rx="5" fill="#b3c0c0" opacity=".55"/>
      <rect x="28" y="240" width="172" height="7" rx="3.5" fill="#2b3639"/>
      <rect x="216" y="222" width="48" height="10" rx="5" fill="#e6c07b" opacity=".7"/>
    </g>

    <rect x="28" y="274" width="112" height="22" rx="11" fill="#4fa39e" opacity=".7"/>
  </g>
</svg>
