<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Abstract illustration of branching career pathways leading to a milestone marker">
  <defs>
    <linearGradient id="cr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#182124"/>
      <stop offset="100%" stop-color="#101618"/>
    </linearGradient>
    <linearGradient id="cr-glow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#4fa39e" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#e6c07b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="cr-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2b3639" stroke-width="1" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#cr-bg)"/>
  <rect width="800" height="500" fill="url(#cr-grid)"/>
  <rect width="800" height="500" fill="url(#cr-glow)"/>

  <!-- branching paths -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M120 250h84c34 0 34-86 68-86h96" stroke="#2b3639"/>
    <path d="M120 250h84c34 0 34 86 68 86h96" stroke="#2b3639"/>
    <path d="M120 250h84c34 0 34 0 68 0h96" stroke="#e6c07b" stroke-dasharray="1 0" opacity=".9"/>
    <path d="M368 164h72c30 0 30-52 60-52h60" stroke="#2b3639"/>
    <path d="M368 336h72c30 0 30 52 60 52h60" stroke="#2b3639"/>
    <path d="M368 250h112c34 0 34-56 68-56h64" stroke="#4fa39e" opacity=".8"/>
  </g>

  <!-- start node -->
  <g transform="translate(120 250)">
    <circle r="26" fill="#0d1214" stroke="#e6c07b" stroke-width="3"/>
    <circle r="9" fill="#e6c07b"/>
  </g>

  <!-- junction nodes -->
  <g fill="#0d1214" stroke="#2b3639" stroke-width="3">
    <circle cx="368" cy="164" r="17"/>
    <circle cx="368" cy="336" r="17"/>
    <circle cx="480" cy="250" r="17" stroke="#4fa39e"/>
  </g>
  <circle cx="480" cy="250" r="6" fill="#4fa39e"/>

  <!-- option cards -->
  <g>
    <g transform="translate(560 80)">
      <rect width="164" height="64" rx="12" fill="#0d1214" stroke="#2b3639"/>
      <rect x="18" y="20" width="76" height="9" rx="4.5" fill="#2b3639"/>
      <rect x="18" y="38" width="112" height="7" rx="3.5" fill="#243033"/>
    </g>
    <g transform="translate(560 162)">
      <rect width="164" height="64" rx="12" fill="#0d1214" stroke="#4fa39e" stroke-opacity=".7"/>
      <rect x="18" y="20" width="94" height="9" rx="4.5" fill="#4fa39e" opacity=".75"/>
      <rect x="18" y="38" width="104" height="7" rx="3.5" fill="#243033"/>
    </g>
    <g transform="translate(560 244)">
      <rect width="164" height="64" rx="12" fill="#0d1214" stroke="#e6c07b" stroke-opacity=".8"/>
      <rect x="18" y="20" width="84" height="9" rx="4.5" fill="#e6c07b" opacity=".85"/>
      <rect x="18" y="38" width="120" height="7" rx="3.5" fill="#243033"/>
    </g>
    <g transform="translate(560 356)">
      <rect width="164" height="64" rx="12" fill="#0d1214" stroke="#2b3639"/>
      <rect x="18" y="20" width="68" height="9" rx="4.5" fill="#2b3639"/>
      <rect x="18" y="38" width="98" height="7" rx="3.5" fill="#243033"/>
    </g>
  </g>
</svg>
