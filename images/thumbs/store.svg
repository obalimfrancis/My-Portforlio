<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Abstract illustration of a storefront product grid with a shopping cart badge">
  <defs>
    <linearGradient id="st-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#182124"/>
      <stop offset="100%" stop-color="#101618"/>
    </linearGradient>
    <linearGradient id="st-glow" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fa39e" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#e6c07b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="st-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2b3639" stroke-width="1" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#st-bg)"/>
  <rect width="800" height="500" fill="url(#st-grid)"/>
  <rect width="800" height="500" fill="url(#st-glow)"/>

  <!-- browser chrome -->
  <g transform="translate(80 70)">
    <rect width="640" height="360" rx="18" fill="#0d1214" stroke="#2b3639"/>
    <path d="M0 18a18 18 0 0 1 18-18h604a18 18 0 0 1 18 18v30H0z" fill="#151d1f"/>
    <circle cx="28" cy="24" r="5" fill="#2b3639"/>
    <circle cx="46" cy="24" r="5" fill="#2b3639"/>
    <circle cx="64" cy="24" r="5" fill="#2b3639"/>
    <rect x="92" y="17" width="180" height="14" rx="7" fill="#1f292c"/>

    <!-- nav row -->
    <rect x="28" y="72" width="70" height="10" rx="5" fill="#e6c07b" opacity=".85"/>
    <rect x="116" y="72" width="54" height="10" rx="5" fill="#2b3639"/>
    <rect x="186" y="72" width="54" height="10" rx="5" fill="#2b3639"/>

    <!-- cart icon -->
    <g transform="translate(556 62)" fill="none" stroke="#4fa39e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 4h8l6 22h26l6-16H14"/>
      <circle cx="20" cy="34" r="4"/>
      <circle cx="38" cy="34" r="4"/>
    </g>
    <circle cx="600" cy="62" r="11" fill="#e6c07b"/>
    <text x="600" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0d1214">3</text>

    <!-- product grid -->
    <g>
      <g transform="translate(28 110)">
        <rect width="180" height="212" rx="12" fill="#151d1f" stroke="#243033"/>
        <rect x="14" y="14" width="152" height="108" rx="8" fill="#1f292c"/>
        <circle cx="90" cy="60" r="26" fill="#2b3639"/>
        <rect x="14" y="138" width="110" height="10" rx="5" fill="#2b3639"/>
        <rect x="14" y="158" width="74" height="10" rx="5" fill="#243033"/>
        <rect x="14" y="184" width="56" height="16" rx="8" fill="#e6c07b" opacity=".85"/>
      </g>
      <g transform="translate(230 110)">
        <rect width="180" height="212" rx="12" fill="#151d1f" stroke="#243033"/>
        <rect x="14" y="14" width="152" height="108" rx="8" fill="#1f292c"/>
        <rect x="50" y="36" width="80" height="52" rx="6" fill="#2b3639"/>
        <rect x="14" y="138" width="126" height="10" rx="5" fill="#2b3639"/>
        <rect x="14" y="158" width="62" height="10" rx="5" fill="#243033"/>
        <rect x="14" y="184" width="56" height="16" rx="8" fill="#4fa39e" opacity=".8"/>
      </g>
      <g transform="translate(432 110)">
        <rect width="180" height="212" rx="12" fill="#151d1f" stroke="#243033"/>
        <rect x="14" y="14" width="152" height="108" rx="8" fill="#1f292c"/>
        <path d="M44 92l30-38 24 28 18-20 26 30z" fill="#2b3639"/>
        <rect x="14" y="138" width="96" height="10" rx="5" fill="#2b3639"/>
        <rect x="14" y="158" width="80" height="10" rx="5" fill="#243033"/>
        <rect x="14" y="184" width="56" height="16" rx="8" fill="#e6c07b" opacity=".55"/>
      </g>
    </g>
  </g>
</svg>
