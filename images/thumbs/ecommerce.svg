<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Abstract illustration of a product listing page with filters and price tags">
  <defs>
    <linearGradient id="ec-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#182124"/>
      <stop offset="100%" stop-color="#101618"/>
    </linearGradient>
    <linearGradient id="ec-glow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6c07b" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#4fa39e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="ec-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2b3639" stroke-width="1" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#ec-bg)"/>
  <rect width="800" height="500" fill="url(#ec-grid)"/>
  <rect width="800" height="500" fill="url(#ec-glow)"/>

  <!-- filter sidebar -->
  <g transform="translate(72 96)">
    <rect width="168" height="308" rx="14" fill="#0d1214" stroke="#2b3639"/>
    <rect x="22" y="26" width="72" height="10" rx="5" fill="#e6c07b" opacity=".85"/>
    <g fill="#2b3639">
      <rect x="22" y="62" width="100" height="8" rx="4"/>
      <rect x="22" y="88" width="82" height="8" rx="4"/>
      <rect x="22" y="114" width="94" height="8" rx="4"/>
    </g>
    <!-- checkboxes -->
    <g>
      <rect x="22" y="152" width="14" height="14" rx="4" fill="none" stroke="#4fa39e" stroke-width="2"/>
      <path d="M25 159l3.5 3.5L34 156" fill="none" stroke="#4fa39e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="46" y="155" width="76" height="8" rx="4" fill="#2b3639"/>

      <rect x="22" y="184" width="14" height="14" rx="4" fill="none" stroke="#2b3639" stroke-width="2"/>
      <rect x="46" y="187" width="60" height="8" rx="4" fill="#243033"/>

      <rect x="22" y="216" width="14" height="14" rx="4" fill="none" stroke="#2b3639" stroke-width="2"/>
      <rect x="46" y="219" width="88" height="8" rx="4" fill="#243033"/>
    </g>
    <!-- price slider -->
    <rect x="22" y="264" width="124" height="4" rx="2" fill="#243033"/>
    <rect x="22" y="264" width="72" height="4" rx="2" fill="#e6c07b" opacity=".8"/>
    <circle cx="94" cy="266" r="8" fill="#e6c07b"/>
  </g>

  <!-- product cards -->
  <g transform="translate(264 96)">
    <g transform="translate(0 0)">
      <rect width="222" height="146" rx="12" fill="#0d1214" stroke="#2b3639"/>
      <rect x="14" y="14" width="86" height="118" rx="8" fill="#1f292c"/>
      <circle cx="57" cy="60" r="22" fill="#2b3639"/>
      <rect x="116" y="26" width="86" height="10" rx="5" fill="#2b3639"/>
      <rect x="116" y="48" width="58" height="8" rx="4" fill="#243033"/>
      <rect x="116" y="76" width="46" height="18" rx="9" fill="#e6c07b" opacity=".85"/>
      <rect x="116" y="108" width="72" height="14" rx="7" fill="#4fa39e" opacity=".5"/>
    </g>
    <g transform="translate(242 0)">
      <rect width="222" height="146" rx="12" fill="#0d1214" stroke="#2b3639"/>
      <rect x="14" y="14" width="86" height="118" rx="8" fill="#1f292c"/>
      <rect x="32" y="40" width="50" height="44" rx="6" fill="#2b3639"/>
      <rect x="116" y="26" width="70" height="10" rx="5" fill="#2b3639"/>
      <rect x="116" y="48" width="76" height="8" rx="4" fill="#243033"/>
      <rect x="116" y="76" width="46" height="18" rx="9" fill="#4fa39e" opacity=".8"/>
      <rect x="116" y="108" width="72" height="14" rx="7" fill="#243033"/>
    </g>
    <g transform="translate(0 162)">
      <rect width="222" height="146" rx="12" fill="#0d1214" stroke="#2b3639"/>
      <rect x="14" y="14" width="86" height="118" rx="8" fill="#1f292c"/>
      <path d="M28 96l22-28 18 20 14-14 18 22z" fill="#2b3639"/>
      <rect x="116" y="26" width="78" height="10" rx="5" fill="#2b3639"/>
      <rect x="116" y="48" width="52" height="8" rx="4" fill="#243033"/>
      <rect x="116" y="76" width="46" height="18" rx="9" fill="#e6c07b" opacity=".55"/>
      <rect x="116" y="108" width="72" height="14" rx="7" fill="#243033"/>
    </g>
    <g transform="translate(242 162)">
      <rect width="222" height="146" rx="12" fill="#0d1214" stroke="#2b3639"/>
      <rect x="14" y="14" width="86" height="118" rx="8" fill="#1f292c"/>
      <circle cx="57" cy="73" r="26" fill="none" stroke="#2b3639" stroke-width="6"/>
      <rect x="116" y="26" width="64" height="10" rx="5" fill="#2b3639"/>
      <rect x="116" y="48" width="84" height="8" rx="4" fill="#243033"/>
      <rect x="116" y="76" width="46" height="18" rx="9" fill="#e6c07b" opacity=".85"/>
      <rect x="116" y="108" width="72" height="14" rx="7" fill="#4fa39e" opacity=".35"/>
    </g>
  </g>
</svg>
