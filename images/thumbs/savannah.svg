<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Abstract illustration of a QR code beside an admin dashboard panel">
  <defs>
    <linearGradient id="sg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#182124"/>
      <stop offset="100%" stop-color="#101618"/>
    </linearGradient>
    <linearGradient id="sg-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6c07b" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#4fa39e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="sg-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2b3639" stroke-width="1" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#sg-bg)"/>
  <rect width="800" height="500" fill="url(#sg-grid)"/>
  <rect width="800" height="500" fill="url(#sg-glow)"/>

  <!-- QR panel -->
  <g transform="translate(72 118)">
    <rect x="-16" y="-16" width="256" height="256" rx="18" fill="#0d1214" stroke="#2b3639"/>
    <g fill="#e6c07b">
      <!-- finder squares -->
      <path d="M0 0h64v64H0z" fill="none" stroke="#e6c07b" stroke-width="12"/>
      <rect x="24" y="24" width="16" height="16"/>
      <path d="M160 0h64v64h-64z" fill="none" stroke="#e6c07b" stroke-width="12"/>
      <rect x="184" y="24" width="16" height="16"/>
      <path d="M0 160h64v64H0z" fill="none" stroke="#e6c07b" stroke-width="12"/>
      <rect x="24" y="184" width="16" height="16"/>
      <!-- data cells -->
      <g opacity=".85">
        <rect x="80" y="8" width="16" height="16"/><rect x="112" y="24" width="16" height="16"/>
        <rect x="80" y="48" width="16" height="16"/><rect x="128" y="56" width="16" height="16"/>
        <rect x="8" y="80" width="16" height="16"/><rect x="40" y="80" width="16" height="16"/>
        <rect x="80" y="80" width="16" height="16"/><rect x="128" y="80" width="16" height="16"/>
        <rect x="176" y="80" width="16" height="16"/><rect x="208" y="96" width="16" height="16"/>
        <rect x="24" y="112" width="16" height="16"/><rect x="72" y="112" width="16" height="16"/>
        <rect x="120" y="120" width="16" height="16"/><rect x="168" y="112" width="16" height="16"/>
        <rect x="8" y="136" width="16" height="16"/><rect x="96" y="144" width="16" height="16"/>
        <rect x="144" y="136" width="16" height="16"/><rect x="200" y="144" width="16" height="16"/>
        <rect x="88" y="176" width="16" height="16"/><rect x="128" y="168" width="16" height="16"/>
        <rect x="176" y="184" width="16" height="16"/><rect x="208" y="176" width="16" height="16"/>
        <rect x="96" y="208" width="16" height="16"/><rect x="144" y="208" width="16" height="16"/>
        <rect x="192" y="208" width="16" height="16"/>
      </g>
    </g>
    <!-- scan line -->
    <rect x="-16" y="104" width="256" height="3" fill="#4fa39e" opacity=".75"/>
  </g>

  <!-- Dashboard panel -->
  <g transform="translate(392 96)">
    <rect width="336" height="308" rx="16" fill="#0d1214" stroke="#2b3639"/>
    <rect x="0" y="0" width="336" height="44" rx="16" fill="#151d1f"/>
    <rect x="0" y="30" width="336" height="14" fill="#151d1f"/>
    <circle cx="26" cy="22" r="5" fill="#4fa39e"/>
    <rect x="44" y="17" width="88" height="10" rx="5" fill="#2b3639"/>
    <rect x="274" y="15" width="44" height="14" rx="7" fill="#e6c07b" opacity=".3"/>

    <!-- stat tiles -->
    <g>
      <rect x="20" y="66" width="140" height="70" rx="10" fill="#151d1f" stroke="#243033"/>
      <rect x="36" y="82" width="46" height="8" rx="4" fill="#2b3639"/>
      <rect x="36" y="100" width="72" height="18" rx="4" fill="#e6c07b" opacity=".75"/>

      <rect x="176" y="66" width="140" height="70" rx="10" fill="#151d1f" stroke="#243033"/>
      <rect x="192" y="82" width="46" height="8" rx="4" fill="#2b3639"/>
      <rect x="192" y="100" width="56" height="18" rx="4" fill="#4fa39e" opacity=".75"/>
    </g>

    <!-- bar chart -->
    <g>
      <rect x="20" y="154" width="296" height="130" rx="10" fill="#151d1f" stroke="#243033"/>
      <rect x="36" y="170" width="60" height="8" rx="4" fill="#2b3639"/>
      <g>
        <rect x="42" y="236" width="22" height="32" rx="4" fill="#2b3639"/>
        <rect x="78" y="216" width="22" height="52" rx="4" fill="#2b3639"/>
        <rect x="114" y="226" width="22" height="42" rx="4" fill="#4fa39e" opacity=".55"/>
        <rect x="150" y="196" width="22" height="72" rx="4" fill="#4fa39e" opacity=".75"/>
        <rect x="186" y="206" width="22" height="62" rx="4" fill="#2b3639"/>
        <rect x="222" y="184" width="22" height="84" rx="4" fill="#e6c07b" opacity=".9"/>
        <rect x="258" y="212" width="22" height="56" rx="4" fill="#2b3639"/>
      </g>
    </g>
  </g>
</svg>
